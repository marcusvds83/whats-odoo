services:
  # Main Next.js Web Application
  - type: web
    name: whatsapp-odoo-middleware
    runtime: node
    plan: starter
    buildCommand: |
      npm install &&
      cd mini-services/whatsapp-service && npm install && cd ../.. &&
      cd mini-services/odoo-service && npm install && cd ../.. &&
      npx prisma generate &&
      npx prisma db push
    startCommand: |
      npx tsx mini-services/whatsapp-service/index.ts &
      npx tsx mini-services/odoo-service/index.ts &
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-odoo-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: ODOO_SERVICE_URL
        value: http://localhost:3002
    healthCheckPath: /

databases:
  - name: whatsapp-odoo-db
    databaseName: whatsapp_odoo
    plan: starter
