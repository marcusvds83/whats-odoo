services:
  - type: web
    name: whatsapp-odoo-middleware
    runtime: node
    plan: starter
    buildCommand: |
      npm install &&
      cd mini-services/whatsapp-service && npm install && cd ../.. &&
      cd mini-services/odoo-service && npm install && cd ../.. &&
      npx prisma generate
    startCommand: |
      npx prisma db push &&
      npx tsx mini-services/whatsapp-service/index.ts &
      npx tsx mini-services/odoo-service/index.ts &
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./data/whats-odoo.db
      - key: PORT
        value: 10000
      - key: ODOO_SERVICE_URL
        value: http://localhost:3002
    disk:
      name: whats-odoo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
