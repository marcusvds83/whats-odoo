services:
  - type: web
    name: whats-odoo
    runtime: node
    plan: starter
    buildCommand: |
      npm install &&
      cd mini-services/whatsapp-service && npm install && cd ../.. &&
      cd mini-services/odoo-service && npm install && cd ../.. &&
      npx prisma generate &&
      npm run build
    startCommand: |
      mkdir -p /opt/render/project/src/data/auth_store &&
      npx prisma db push &&
      npx tsx mini-services/whatsapp-service/index.ts &
      npx tsx mini-services/odoo-service/index.ts &
      sleep 3 &&
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/whats-odoo.db
      - key: WHATSAPP_SERVICE_URL
        value: http://localhost:3001
      - key: ODOO_SERVICE_URL
        value: http://localhost:3002
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USERNAME
        sync: false
      - key: ODOO_PASSWORD
        sync: false
    disk:
      name: whats-odoo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
