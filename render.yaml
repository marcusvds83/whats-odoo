services:
  - type: web
    name: whats-odoo
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx next build
    startCommand: npx prisma db push && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/whats-odoo.db
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ODOO_URL
        value: https://3code-nexus.odoo.com
      - key: ODOO_DB
        value: 3code-nexus
      - key: ODOO_USERNAME
        sync: false
      - key: ODOO_PASSWORD
        sync: false
      # v7.28: Session signing secret (required in production)
      - key: JWT_SECRET
        sync: false
      # v7.28: Firebase — logins no Firestore (optional, picks ONE credential form)
      # Use either FIREBASE_SERVICE_ACCOUNT (full JSON) OR the B64 form OR split vars.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # - key: FIREBASE_SERVICE_ACCOUNT_B64
      #   sync: false
      # - key: FIREBASE_PROJECT_ID
      #   sync: false
      # - key: FIREBASE_CLIENT_EMAIL
      #   sync: false
      # - key: FIREBASE_PRIVATE_KEY
      #   sync: false
    disk:
      name: whats-odoo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
