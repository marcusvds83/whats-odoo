services:
  - type: web
    name: whats-odoo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: bash start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/whats-odoo.db
      - key: WHATSAPP_SERVICE_URL
        value: http://localhost:3001
      - key: ODOO_SERVICE_URL
        value: http://localhost:3002
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USERNAME
        sync: false
      - key: ODOO_PASSWORD
        sync: false
    disk:
      name: whats-odoo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
