services:
  # Main Next.js Web Application
  - type: web
    name: whatsapp-odoo-middleware
    runtime: node
    plan: starter
    buildCommand: |
      cd /opt/render/project/src && npm install &&
      cd mini-services/whatsapp-service && npm install &&
      cd ../odoo-service && npm install &&
      cd /opt/render/project/src && npm run db:push
    startCommand: |
      cd /opt/render/project/src &&
      node mini-services/whatsapp-service/index.ts &
      node mini-services/odoo-service/index.ts &
      npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-odoo-db
          property: connectionString
      - key: PORT
        value: 10000
    healthCheckPath: /

databases:
  - name: whatsapp-odoo-db
    databaseName: whatsapp_odoo
    plan: starter
